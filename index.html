<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Seguridad - Facultad de Contaduría y Administración</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .status-card { margin: 20px 0; padding: 15px; border-radius: 10px; font-weight: bold; }
        #btnSistema { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; transition: 0.3s; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .new-row { background-color: #e8f5e9; animation: highlight 2s; }
        @keyframes highlight { from { background-color: #fff9c4; } to { background-color: transparent; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Vigilante Iron Man</h1>
    
    <div class="status-card">
        <button id="btnSistema" onclick="toggleSistema()">Cargando sistema...</button>
    </div>

    <hr>

    <h3>Registro de Actividad (Tiempo Real)</h3>
    <table>
        <thead>
            <tr>
                <th>Evento</th>
                <th>Hora de Detección</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            </tbody>
    </table>
</div>

<script>
    // Tu configuración de Firebase
    const firebaseConfig = {
        databaseURL: "https://ahuyentador-ae35d-default-rtdb.firebaseio.com"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. CONTROL DEL BOTÓN (ON/OFF)
    const btn = document.getElementById('btnSistema');
    let estadoActual = false;

    db.ref('estado_sistema').on('value', (snapshot) => {
        estadoActual = snapshot.val();
        btn.innerText = estadoActual ? "SISTEMA ARMADO (ON)" : "SISTEMA DESACTIVADO (OFF)";
        btn.style.backgroundColor = estadoActual ? "#e74c3c" : "#2ecc71";
        btn.style.color = "white";
    });

    function toggleSistema() {
        db.ref('estado_sistema').set(!estadoActual);
    }

    // 2. TABLA AUTOMÁTICA (Muestra los últimos 5 eventos)
    db.ref('detecciones').limitToLast(5).on('value', (snapshot) => {
        const cuerpo = document.getElementById('cuerpoTabla');
        cuerpo.innerHTML = ""; // Limpia para no duplicar
        
        const data = snapshot.val();
        if (data) {
            // Ordenar por la "key" (ID_) que tiene el timestamp de Arduino
            const keys = Object.keys(data).sort().reverse();
            
            keys.forEach(key => {

            cuerpo.innerHTML = "<tr><td colspan='2'>Sin actividad reciente</td></tr>";
        }

</script>

</body>
</html>
