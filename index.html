<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Iron Man Security</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>

    <h2>Control del Sistema</h2>
    <button id="btnSistema" onclick="toggleSistema()" style="padding: 10px 20px; cursor: pointer;">
        Cargando estado...
    </button>

    <hr>

    <h3>Historial de Movimientos</h3>
    <table border="1" id="tablaMovimientos" style="width: 100%; text-align: left;">
        <thead>
            <tr>
                <th>Evento</th>
                <th>Fecha y Hora</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            </tbody>
    </table>

    <script>
        // CONFIGURACIÓN DE TU FIREBASE
        const firebaseConfig = {
            databaseURL: "https://ahuyentador-ae35d-default-rtdb.firebaseio.com"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 1. ESCUCHAR EL BOTÓN (ENCENDIDO/APAGADO)
        const btn = document.getElementById('btnSistema');
        let estadoActual = false;

        db.ref('estado_sistema').on('value', (snapshot) => {
            estadoActual = snapshot.val();
            btn.innerText = estadoActual ? "DESACTIVAR SISTEMA" : "ACTIVAR SISTEMA";
            btn.style.backgroundColor = estadoActual ? "#ff4d4d" : "#4CAF50";
            btn.style.color = "white";
        });

        function toggleSistema() {
            db.ref('estado_sistema').set(!estadoActual);
        }

        // 2. TABLA EN TIEMPO REAL (SIN REFRESCAR)
        db.ref('detecciones').on('value', (snapshot) => {
            const cuerpo = document.getElementById('cuerpoTabla');
            cuerpo.innerHTML = ""; // Limpiar tabla
            
            const data = snapshot.val();
            if (data) {
                // Convertir a array y voltear para ver el más nuevo arriba
                const registros = Object.keys(data).reverse();
                
                registros.forEach(key => {
                    const item = data[key];
                    let fila = `<tr>
                        <td>${item.evento || "Movimiento Detectado"}</td>
                        <td>${new Date(parseInt(key.split('_')[1])).toLocaleString()}</td>
                    </tr>`;
                    cuerpo.innerHTML += fila;
                });
            }
        });
    </script>
</body>
</html>
