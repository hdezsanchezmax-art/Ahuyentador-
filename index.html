<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Ahuyentador Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .status-online { color: #28a745; font-weight: bold; }
        .table-container { max-height: 400px; overflow-y: auto; }
        #btn-control { width: 100%; padding: 15px; font-size: 1.2rem; border-radius: 10px; transition: 0.3s; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            
            <div class="text-center mb-4">
                <h2 class="fw-bold">Sistema de Seguridad UV</h2>
                <p class="text-muted">Facultad de Contaduría y Administración</p>
            </div>

            <div class="card p-4 mb-4">
                <h5 class="card-title mb-3">Estado del Sistema</h5>
                <button id="btn-control" class="btn btn-secondary">Cargando estado...</button>
                <p class="text-center mt-2 mb-0">Estado actual: <span id="lbl-estado">Desconocido</span></p>
            </div>

            <div class="card p-4">
                <h5 class="card-title mb-3">Historial de Movimiento</h5>
                <div class="table-container">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Evento</th>
                                <th>Fecha y Hora</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-cuerpo">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // 1. CONFIGURACIÓN (Usa tus credenciales)
    const firebaseConfig = {
        databaseURL: "https://ahuyentador-ae35d-default-rtdb.firebaseio.com"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. REFERENCIAS
    const btnControl = document.getElementById('btn-control');
    const lblEstado = document.getElementById('lbl-estado');
    const tablaCuerpo = document.getElementById('tabla-cuerpo');

    // 3. LOGICA DEL BOTÓN (ENCENDER/APAGAR)
    let sistemaActivo = false;

    db.ref('estado_sistema').on('value', (snapshot) => {
        sistemaActivo = snapshot.val();
        if (sistemaActivo) {
            btnControl.innerText = "DESACTIVAR SISTEMA";
            btnControl.className = "btn btn-danger";
            lblEstado.innerText = "ACTIVO Y VIGILANDO";
            lblEstado.className = "status-online";
        } else {
            btnControl.innerText = "ACTIVAR SISTEMA";
            btnControl.className = "btn btn-success";
            lblEstado.innerText = "APAGADO";
            lblEstado.className = "text-secondary";
        }
    });

    btnControl.onclick = () => {
        db.ref('estado_sistema').set(!sistemaActivo);
    };

    // 4. ACTUALIZACIÓN AUTOMÁTICA DE LA TABLA
    // 'child_added' hace que la tabla se actualice sin refrescar la página
    db.ref('detecciones').limitToLast(15).on('child_added', (snapshot) => {
        const ahora = new Date();
        const tiempoStr = ahora.toLocaleDateString() + " " + ahora.toLocaleTimeString();
        
        // Creamos la fila
        let nuevaFila = `
            <tr>
                <td><strong class="text-primary">Movimiento confirmado</strong></td>
                <td>${tiempoStr}</td>
                <td><span class="badge bg-warning text-dark">Detectado</span></td>
            </tr>
        `;
        
        // La insertamos al inicio de la tabla
        tablaCuerpo.insertAdjacentHTML('afterbegin', nuevaFila);
    });
</script>

</body>
</html>
