<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ahuyentador IoT</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; color: #333; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h1 { color: #1a73e8; margin-bottom: 10px; }
        .status-box { font-size: 1.2rem; font-weight: bold; padding: 15px; border-radius: 8px; margin: 20px 0; background: #e8f0fe; }
        .btn { padding: 15px 30px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; margin: 10px; font-weight: bold; transition: 0.3s; text-transform: uppercase; }
        .btn-on { background-color: #34a853; color: white; }
        .btn-on:hover { background-color: #2d9249; transform: scale(1.05); }
        .btn-off { background-color: #ea4335; color: white; }
        .btn-off:hover { background-color: #d33828; transform: scale(1.05); }
        
        /* Estilos de la Tabla */
        .table-container { margin-top: 30px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #1a73e8; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        .badge { background: #fbbc05; color: #000; padding: 5px 10px; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Sistema Ahuyentador Inteligente</h1>
        <p>Facultad de Contaduría y Administración - Universidad Veracruzana</p>
        <hr>
        
        <div id="status" class="status-box">Conectando con la nube...</div>
        
        <div>
            <button class="btn btn-on" onclick="controlarSistema(true)">Activar Vigilancia</button>
            <button class="btn btn-off" onclick="controlarSistema(false)">Desactivar Sistema</button>
        </div>

        <div class="table-container">
            <h3>Registro Histórico de Detecciones</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID de Evento</th>
                        <th>Fecha y Hora del Registro</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // Configuración de tu proyecto ahuyentador-ae35d
        var firebaseConfig = {
            apiKey: "AIzaSyBzmUQKty9xOawDYwMFt-aVycX-xcRFiIc",
            authDomain: "ahuyentador-ae35d.firebaseapp.com",
            databaseURL: "https://ahuyentador-ae35d-default-rtdb.firebaseio.com",
            projectId: "ahuyentador-ae35d",
            storageBucket: "ahuyentador-ae35d.firebasestorage.app",
            messagingSenderId: "928891718509",
            appId: "1:928891718509:web:b3140baca45ba24e8ee864"
        };
        
        // Inicializar Firebase
        firebase.initializeApp(firebaseConfig);
        var database = firebase.database();

        // 1. FUNCIÓN PARA CONTROLAR EL ENCENDIDO/APAGADO
        function controlarSistema(estado) {
            database.ref('/').update({
                estado_sistema: estado
            });
        }

        // 2. ESCUCHAR EL ESTADO EN TIEMPO REAL
        database.ref('/estado_sistema').on('value', (snapshot) => {
            var estado = snapshot.val();
            var statusDiv = document.getElementById('status');
            if(estado === true) {
                statusDiv.style.color = "#34a853";
                statusDiv.innerHTML = "SISTEMA: VIGILANDO (ON) 🛡️";
            } else {
                statusDiv.style.color = "#ea4335";
                statusDiv.innerHTML = "SISTEMA: INACTIVO (OFF) 🛑";
            }
        });

        // 3. ESCUCHAR DETECCIONES Y LLENAR LA TABLA
        // 'limitToLast(10)' muestra solo las últimas 10 para no saturar la pantalla
        database.ref('/detecciones').limitToLast(10).on('child_added', (snapshot) => {
            var timestamp = snapshot.val();
            var idEvento = snapshot.key;
            var tabla = document.getElementById('tabla-cuerpo');
            
            // Crear una nueva fila al principio de la tabla
            var fila = tabla.insertRow(0); 
            fila.innerHTML = `
                <td>${idEvento}</td>
                <td>${timestamp}</td>
                <td><span class="badge">MOVIMIENTO</span></td>
            `;
        });
    </script>
</body>
</html>
