<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Seguridad - Facultad de Contaduría y Administración</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        .status-card { margin: 20px 0; padding: 15px; border-radius: 10px; font-weight: bold; }
        #btnSistema { padding: 15px 30px; font-size: 18px; cursor: pointer; border: none; border-radius: 8px; transition: 0.3s; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .new-row { background-color: #e8f5e9; animation: highlight 2s; }
        @keyframes highlight { from { background-color: #fff9c4; } to { background-color: transparent; } }
    </style>
</head>
<body>

<div class="container">
    <h1>Vigilante Iron Man</h1>
    
    <div class="status-card">
        <button id="btnSistema" onclick="toggleSistema()">Cargando sistema...</button>
    </div>

    <hr>

    <h3>Registro de Actividad (Tiempo Real)</h3>
    <table>
        <thead>
            <tr>
                <th>Evento</th>
                <th>Hora de Detección</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla">
            </tbody>
    </table>
</div>

<script>
  // Variable local para controlar el flujo de la UI
let sistemaActivo = false;

// =======================================================
// 1. ESCUCHAR EL INTERRUPTOR GENERAL (ON / OFF)
// =======================================================
db.ref('/estado_sistema').on('value', (snapshot) => {
    sistemaActivo = snapshot.val();
    
    const boton = document.getElementById('boton-sistema'); // Asegúrate de usar el ID real de tu botón
    const tabla = document.getElementById('tabla-actividad'); // Asegúrate de usar el ID real de tu cuerpo de tabla (tbody)
    
    if (sistemaActivo) {
        // Interfaz en modo Activo / Alerta
        boton.innerHTML = "SISTEMA ARMADO (ON)";
        boton.style.backgroundColor = "#dc3545"; // Rojo Alerta
        
        // Si la tabla contiene el mensaje de apagado, la vaciamos para esperar datos reales
        if (tabla.innerHTML.includes("Sistema apagado")) {
            tabla.innerHTML = "";
        }
    } else {
        // Interfaz en modo Desactivado / Seguro
        boton.innerHTML = "SISTEMA DESACTIVADO (OFF)";
        boton.style.backgroundColor = "#2ecc71"; // Verde Seguro
        
        // ¡EL TRUCO DE LIMPIEZA! Borra toda la actividad vieja al apagar el sistema
        tabla.innerHTML = `
            <tr id="fila-estado-off">
                <td colspan="2" style="text-align: center; color: #7f8c8d; font-style: italic; padding: 15px;">
                    🚫 Sistema apagado - Sin registros de actividad
                </td>
            </tr>
        `;
    }
});

// =======================================================
// 2. ESCUCHAR LAS DETECCIONES EN TIEMPO REAL
// =======================================================
db.ref('/detecciones').on('child_added', (snapshot) => {
    // REGLA DE ORO: Solo procesa y pinta si el sistema está activo en la pantalla
    if (sistemaActivo) {
        const mensajeAlerta = snapshot.val();
        const horaActual = new Date().toLocaleTimeString();
        
        const tabla = document.getElementById('tabla-actividad');
        const filaMensajeOff = document.getElementById('fila-estado-off');
        
        // Si el mensaje de "Sistema apagado" está presente, lo removemos de inmediato
        if (filaMensajeOff) {
            filaMensajeOff.remove();
        }

        // Creamos la nueva fila estructurada con el evento real
        const nuevaFila = `
            <tr style="animation: fadeIn 0.5s ease-in-out;">
                <td style="padding: 12px; font-weight: bold; color: #c0392b;">⚠️ ${mensajeAlerta}</td>
                <td style="padding: 12px; color: #2c3e50;">${horaActual}</td>
            </tr>
        `;
        
        // Insertar el nuevo evento al principio de la tabla para ver lo más reciente arriba
        tabla.insertAdjacentHTML('afterbegin', nuevaFila);
    }
});

// =======================================================
// 3. FUNCIÓN DEL BOTÓN PARA CAMBIAR EL ESTADO (REGISTRO DEL CLICK)
// =======================================================
function alternarSistema() {
    // Invierte el estado actual y lo empuja a Firebase
    db.ref('/estado_sistema').set(!sistemaActivo);
}
</script>
    
</body>
</html>
